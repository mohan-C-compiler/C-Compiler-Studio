
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Compiler Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        header {
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 32px;
        }

        header p {
            color: #cbd5e1;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #0f172a;
            color: #22c55e;
            padding: 15px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            min-height: 70px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    <h1> C Compiler Studio </h1>
    <p>Your Online C Programming Learning Platform</p>
</header>

<div class="container">

    <h2>Write Your C Program</h2>

    <textarea id="code">#include <stdio.h>

int main() {
    printf("Welcome to C Compiler Studio!");
    return 0;
}</textarea>

    <br>

    <button onclick="showCode()">Run Preview</button>

    <div class="output">
        <h3>Output</h3>
        <pre id="result">Your output will appear here.</pre>
    </div>

</div>

<footer>
    <p>© 2026 C Compiler Studio | Learn. Code. Create.</p>
</footer>

<script>
    function showCode() {
        document.getElementById("result").textContent =
        "Code received! Connect a C compiler service to execute your program.";
    }
</script>

</body>
  </html>
